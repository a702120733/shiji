<main><div class="topbar">我的空间　›　<strong>Chrome 收藏夹</strong></div><div class="content"><header><div><h1>Chrome 收藏夹</h1><p>选择自己从 Chrome 导出的 HTML 文件；原始文件夹层级会保留为三级目录。</p></div><span class="badge" id="total">0 条</span></header>
<section class="panel"><h2>导入书签</h2><p>在 Chrome 的书签管理器中选择“导出书签”，然后在这里选择生成的 HTML。文件只发送到本机服务，不上传云端。再次导入会替换当前书签副本。</p><div class="import-row"><input id="bookmark-file" type="file" accept="text/html,.html"><button id="import-bookmarks" type="button">导入到本机</button></div><p id="message" role="status"></p></section>
<div class="controls"><label>文件夹 <select id="folder-filter"><option value="">全部</option></select></label><input id="search" type="search" placeholder="搜索标题或网址"><span id="count">显示 0 条</span></div><div id="bookmark-groups" class="groups"></div><p class="empty" id="empty">还没有书签。先从 Chrome 导出 HTML 并导入。</p></div></main></div></body></html>
