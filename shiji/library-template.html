<script>
const cards=[...document.querySelectorAll('article')];
const grid=document.querySelector('.grid');
const search=document.querySelector('#search');
const cleanTiles=[...grid.querySelectorAll('.clean-tile')];
const noteCards=new Map(cards.map(card=>[card.dataset.noteId,card]));
const tilesByNote=new Map();
for(const tile of cleanTiles){
  const id=tile.dataset.cleanNoteId;
  if(!tilesByNote.has(id))tilesByNote.set(id,[]);
  tilesByNote.get(id).push(tile);
}
let selected='',selectedGroupId='',selectedFolderId='',selectedFolderName='',selectedFolderGroupIds=null,layoutFrame=0;
let cardSizeOverride=null;
const cardSizeInput=document.querySelector('#card-size');
const trashView=new URLSearchParams(location.search).get('view')==='trash';
function setView(mode,persist=true){
  const next=trashView?'original':(['detail','clean','original'].includes(mode)?mode:'detail');
  document.body.classList.toggle('clean-mode',next==='clean');
  document.body.classList.toggle('original-mode',next==='original');
  document.querySelectorAll('[data-view]').forEach(button=>{
    const active=button.dataset.view===next;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  if(persist)try{localStorage.setItem('xhs-liked-view',next);}catch{}
  filter();
  document.dispatchEvent(new CustomEvent('library-mode-change',{detail:{mode:next}}));
}

// Stable DOM order retains the liked-list order and keyboard reading order.
// Place each visible card in the shortest column, without grouping by column.
function layoutMasonry(){
  layoutFrame=0;
  const clean=document.body.classList.contains('clean-mode');
  const visible=[...grid.children].filter(item=>!item.hidden&&(item.classList.contains('clean-tile')?clean:!(clean&&item.dataset.cleanSplit==='true')));
  const styles=getComputedStyle(grid);
  const gap=parseFloat(styles.getPropertyValue('--card-gap'))||14;
  const minimum=parseFloat(styles.getPropertyValue('--card-width'))||240;
  const maxColumns=parseInt(styles.getPropertyValue('--max-columns'))||99;
  const columns=Math.max(1,Math.min(maxColumns,Math.floor((grid.clientWidth+gap)/(minimum+gap))));
  // Fill the fixed content width; the size control changes the column count.
  const width=(grid.clientWidth-gap*(columns-1))/columns;
  if(cardSizeOverride===null){
    cardSizeInput.value=String(Math.max(140,Math.min(360,Math.round(width/2)*2)));
    cardSizeInput.setAttribute('aria-valuetext',`${Math.round(width)} 像素`);
    cardSizeInput.title=`卡片宽度约 ${Math.round(width)} 像素`;
  }
  else{
    cardSizeInput.setAttribute('aria-valuetext',`实际宽度约 ${Math.round(width)} 像素`);
    cardSizeInput.title=`实际卡片宽度约 ${Math.round(width)} 像素`;
  }
  const heights=Array(columns).fill(0);
  grid.classList.add('masonry');
  visible.forEach(card=>card.style.width=`${width}px`);
  for(const card of visible){
    const column=heights.indexOf(Math.min(...heights));
    card.style.transform=`translate(${column*(width+gap)}px,${heights[column]}px)`;
    heights[column]+=card.getBoundingClientRect().height+gap;
  }
  grid.style.height=`${Math.max(0,Math.max(...heights)-gap)}px`;
}
function scheduleLayout(){
  if(!layoutFrame)layoutFrame=requestAnimationFrame(layoutMasonry);
}
function setCardSize(value,persist=true){
  const size=Number(value);
  if(!Number.isFinite(size))return;
  const next=Math.max(140,Math.min(360,Math.round(size/2)*2));
  cardSizeOverride=next;
  document.body.style.setProperty('--card-width',`${next}px`);
  cardSizeInput.value=String(next);
  cardSizeInput.setAttribute('aria-valuetext',`${next} 像素`);
  cardSizeInput.title=`卡片宽度 ${next} 像素`;
  if(persist)try{localStorage.setItem('xhs-liked-card-size',String(next));}catch{}
  scheduleLayout();
}
function filter(){
  let visible=0;
  let mediaVisible=0;
  const activeCount=cards.filter(card=>card.dataset.trashed!=='true').length;
  const trashCount=cards.length-activeCount;
  const q=search.value.trim().toLowerCase();
  for(const card of cards){
    const tags=JSON.parse(card.dataset.tags);
    const inFolder=!selectedFolderGroupIds||selectedFolderGroupIds.has(card.dataset.groupId);
    const matches=selectedGroupId?card.dataset.groupId===selectedGroupId:selected?tags.includes(selected)&&inFolder:inFolder;
    const trashed=card.dataset.trashed==='true';
    card.hidden=trashView?!trashed:!!(trashed||!matches||(q&&!card.dataset.search.includes(q)));
    const tiles=tilesByNote.get(card.dataset.noteId)||[];
    tiles.forEach(tile=>tile.hidden=card.hidden);
    if(!card.hidden){visible++;mediaVisible+=tiles.length||1;}
    else card.querySelectorAll('video').forEach(video=>video.pause());
  }
  document.querySelector('#count').textContent=trashView?`回收站 ${trashCount} 条`
    :document.body.classList.contains('clean-mode')
    ?`显示 ${mediaVisible} 项素材 · 来自 ${visible} / ${activeCount} 条笔记`
    :`显示 ${visible} / ${activeCount} 条`;
  document.querySelector('#selection').textContent=selected?`# ${selected}`:selectedFolderName?`# ${selectedFolderName}`:'';
  document.querySelector('.reset').hidden=!selected&&!selectedFolderId&&!q;
  document.querySelector('#empty').hidden=visible>0;
  document.querySelectorAll('[data-filter]').forEach(button=>{
    const active=button.dataset.filter===selected;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  scheduleLayout();
}
function sortCards(direction){
  const ordered=direction==='reverse'?[...cards].reverse():cards;
  cards.forEach(card=>card.querySelectorAll('video').forEach(video=>video.pause()));
  grid.append(...ordered.flatMap(card=>[card,...(tilesByNote.get(card.dataset.noteId)||[])]));
  document.querySelectorAll('[data-sort]').forEach(button=>{
    const active=button.dataset.sort===direction;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  scheduleLayout();
}
function move(gallery,step){
  const slides=[...gallery.querySelectorAll('.slide')];
  if(slides.length<2)return;
  slides.forEach(slide=>slide.querySelectorAll('video').forEach(video=>video.pause()));
  const index=(Number(gallery.dataset.index)+step+slides.length)%slides.length;
  gallery.dataset.index=index;
  slides.forEach((slide,i)=>slide.hidden=i!==index);
  gallery.style.aspectRatio=slides[index].dataset.aspect;
  gallery.querySelector('.position').textContent=`${slides[index].dataset.kind} ${index+1} / ${slides.length}`;
  const trigger=gallery.querySelector('.media-open');
  if(trigger){
    const isVideo=!!slides[index].querySelector('video');
    trigger.setAttribute('aria-label',trigger.getAttribute('aria-label').replace(/^(放大播放|放大查看)/,isVideo?'放大播放':'放大查看'));
    trigger.querySelector('.expand-hint').textContent=isVideo?'放大播放':'放大查看';
    const playMark=trigger.querySelector('.play-mark');
    if(playMark)playMark.hidden=!isVideo;
  }
  scheduleLayout();
}
// The viewer follows the current filtered/sorted list, then each note's media order.
const viewer=document.querySelector('#media-viewer');
const viewerStage=viewer.querySelector('.viewer-stage');
const viewerTitle=viewer.querySelector('.viewer-title');
const viewerCaption=viewer.querySelector('.viewer-caption');
const viewerClose=viewer.querySelector('.viewer-close');
const viewerControls=viewer.querySelector('.viewer-video-controls');
const viewerPlay=viewer.querySelector('.viewer-play');
const viewerSeek=viewer.querySelector('.viewer-seek');
const viewerTime=viewer.querySelector('.viewer-time');
const viewerPositions=new WeakMap();
let viewerItems=[],viewerIndex=0,viewerTrigger=null,viewerMedia=null;
let suppressMediaClickUntil=0;
let viewerScrubbing=false;

function formatVideoTime(seconds){
  if(!Number.isFinite(seconds)||seconds<0)return '0:00';
  const whole=Math.floor(seconds),minutes=Math.floor(whole/60),secs=String(whole%60).padStart(2,'0');
  return minutes>=60?`${Math.floor(minutes/60)}:${String(minutes%60).padStart(2,'0')}:${secs}`:`${minutes}:${secs}`;
}
function updateViewerControls(video){
  if(viewerMedia!==video)return;
  const duration=video.duration;
  const canSeek=Number.isFinite(duration)&&duration>0;
  viewerSeek.disabled=!canSeek;
  if(!viewerScrubbing)viewerSeek.value=canSeek?String(Math.round(video.currentTime/duration*1000)):'0';
  viewerTime.textContent=`${formatVideoTime(video.currentTime)} / ${formatVideoTime(duration)}`;
  viewerPlay.textContent=video.paused?'▶':'❚❚';
  viewerPlay.setAttribute('aria-label',video.paused?'播放视频':'暂停视频');
}
viewerPlay.addEventListener('click',()=>{
  if(viewerMedia?.tagName!=='VIDEO')return;
  if(viewerMedia.paused)viewerMedia.play().catch(()=>{});
  else viewerMedia.pause();
});
viewerSeek.addEventListener('pointerdown',()=>{viewerScrubbing=true;});
for(const eventName of ['pointerup','pointercancel','change'])viewerSeek.addEventListener(eventName,()=>{viewerScrubbing=false;});
viewerSeek.addEventListener('input',()=>{
  const video=viewerMedia;
  if(video?.tagName!=='VIDEO'||!Number.isFinite(video.duration)||video.duration<=0)return;
  const target=Number(viewerSeek.value)/1000*video.duration;
  video.currentTime=Math.min(Math.max(0,target),Math.max(0,video.duration-.05));
  viewerTime.textContent=`${formatVideoTime(target)} / ${formatVideoTime(video.duration)}`;
});

function releaseViewerMedia(){
  if(viewerMedia?.tagName==='VIDEO'){
    viewerPositions.set(viewerItems[viewerIndex].media,{
      time:viewerMedia.currentTime,volume:viewerMedia.volume,muted:viewerMedia.muted
    });
    viewerMedia.pause();
    viewerMedia.removeAttribute('src');
    viewerMedia.querySelectorAll('source').forEach(source=>source.removeAttribute('src'));
    viewerMedia.load();
  }
  viewerStage.replaceChildren();
  viewerMedia=null;
  viewerScrubbing=false;
  viewerControls.hidden=true;
  viewer.classList.remove('has-video');
}
function showViewerMedia(index){
  releaseViewerMedia();
  viewerIndex=(index+viewerItems.length)%viewerItems.length;
  const item=viewerItems[viewerIndex];
  const media=item.media.cloneNode(true);
  viewerMedia=media;
  viewerTitle.textContent=item.title;
  viewerCaption.textContent=`${item.kind} ${item.slideIndex+1} / ${item.slideCount} · 笔记 ${item.noteIndex+1} / ${item.noteCount}`;
  viewer.querySelectorAll('[data-viewer-step]').forEach(button=>button.disabled=viewerItems.length<2);
  // Return to the same image when the overlay is closed.
  move(item.gallery,item.slideIndex-Number(item.gallery.dataset.index));
  if(media.tagName==='IMG'){
    media.loading='eager';
    media.decoding='async';
  }else{
    viewerControls.hidden=false;
    viewer.classList.add('has-video');
    const position=viewerPositions.get(item.media)||{time:item.media.currentTime,volume:item.media.volume,muted:item.media.muted};
    media.controls=true;
    media.playsInline=true;
    media.preload='metadata';
    media.volume=position.volume;
    media.muted=position.muted;
    media.addEventListener('loadedmetadata',()=>{
      if(viewerMedia===media&&position.time>0){
        media.currentTime=Math.min(position.time,Number.isFinite(media.duration)?Math.max(0,media.duration-.1):position.time);
      }
      updateViewerControls(media);
    },{once:true});
    for(const eventName of ['timeupdate','durationchange','play','pause','seeking','seeked','ended'])media.addEventListener(eventName,()=>updateViewerControls(media));
  }
  viewerStage.append(media);
  if(media.tagName==='VIDEO'){
    updateViewerControls(media);
    media.play().catch(()=>{/* The visible play button remains available if autoplay is blocked. */});
  }
}
function openViewer(gallery,trigger,requestedIndex=Number(gallery.dataset.index)){
  if(Date.now()<suppressMediaClickUntil)return;
  const visible=[...grid.children].filter(card=>card.matches('article')&&!card.hidden);
  viewerItems=visible.flatMap((card,noteIndex)=>{
    const slides=[...card.querySelectorAll('.slide')];
    return slides.map((slide,slideIndex)=>({
      media:slide.querySelector('img,video'),gallery:card.querySelector('.gallery'),
      title:card.querySelector('h2').textContent,kind:slide.dataset.kind,
      slideIndex,slideCount:slides.length,noteIndex,noteCount:visible.length
    })).filter(item=>item.media);
  });
  const index=viewerItems.findIndex(item=>item.gallery===gallery&&item.slideIndex===requestedIndex);
  if(index<0)return;
  viewerTrigger=trigger;
  document.querySelectorAll('video').forEach(video=>video.pause());
  viewer.showModal();
  document.body.classList.add('viewer-open');
  showViewerMedia(index);
  viewerClose.focus({preventScroll:true});
}
function closeViewer(){
  if(!viewer.open)return;
  releaseViewerMedia();
  viewer.close();
  document.body.classList.remove('viewer-open');
  viewerTrigger?.focus({preventScroll:true});
  viewerItems=[];
}
for(const gallery of document.querySelectorAll('.gallery')){
  const video=gallery.querySelector('video');
  if(video)video.controls=false;
  const activeVideo=gallery.querySelector('.slide:not([hidden]) video');
  const tile=gallery.closest('.clean-tile');
  const title=tile?noteCards.get(tile.dataset.cleanNoteId)?.querySelector('h2')?.textContent:gallery.closest('article')?.querySelector('h2')?.textContent;
  const trigger=document.createElement('button');
  trigger.type='button';
  trigger.className='media-open';
  trigger.setAttribute('aria-label',`${activeVideo?'放大播放':'放大查看'}：${title}${tile?' · 图片'+(Number(tile.dataset.slideIndex)+1):''}`);
  trigger.setAttribute('aria-haspopup','dialog');
  if(video){
    trigger.innerHTML='<span class="play-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></span>';
    trigger.querySelector('.play-mark').hidden=!activeVideo;
  }
  const hint=document.createElement('span');
  hint.className='expand-hint';hint.textContent=activeVideo?'放大播放':'放大查看';hint.setAttribute('aria-hidden','true');
  trigger.append(hint);gallery.append(trigger);
}
viewer.addEventListener('click',event=>{
  const step=event.target.closest('[data-viewer-step]');
  if(step){showViewerMedia(viewerIndex+Number(step.dataset.viewerStep));return;}
  if(event.target.closest('.viewer-close')){closeViewer();return;}
  // Only actual media and its native controls consume a click; margins dismiss.
  if(!event.target.closest('.viewer-stage img,.viewer-stage video,.viewer-video-controls'))closeViewer();
});
viewer.addEventListener('cancel',event=>{event.preventDefault();closeViewer();});
viewer.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey)return;
  // Leave media arrow keys to native video seeking/volume while it is focused.
  if(event.target.tagName==='VIDEO'||event.target.closest('.viewer-video-controls'))return;
  if(['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(event.key)){
    event.preventDefault();showViewerMedia(viewerIndex+(['ArrowUp','ArrowLeft'].includes(event.key)?-1:1));
  }
});
viewer.addEventListener('close',()=>{
  releaseViewerMedia();document.body.classList.remove('viewer-open');
});

search.addEventListener('input',filter);
document.addEventListener('click',event=>{
  const mediaTrigger=event.target.closest('.media-open');
  if(mediaTrigger){
    const tile=mediaTrigger.closest('.clean-tile');
    const gallery=tile?noteCards.get(tile.dataset.cleanNoteId)?.querySelector('.gallery'):mediaTrigger.closest('.gallery');
    if(gallery)openViewer(gallery,mediaTrigger,tile?Number(tile.dataset.slideIndex):Number(gallery.dataset.index));
    return;
  }
  const chromeButton=event.target.closest('button[data-open-note]');
  if(chromeButton){
    chromeButton.disabled=true;
    fetch('/api/open-note'+(location.pathname.startsWith('/saved/')?'?source=saved':''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note_id:chromeButton.dataset.openNote})})
      .then(async response=>{if(!response.ok)throw new Error((await response.json()).error||'Chrome 打开失败');chromeButton.textContent='已发送到 Chrome';})
      .catch(error=>{chromeButton.textContent='打开失败';chromeButton.title=error.message;})
      .finally(()=>{chromeButton.disabled=false;setTimeout(()=>{chromeButton.textContent='原笔记 ↗';},3000);});
    return;
  }
  const sort=event.target.closest('button[data-sort]');
  if(sort&&sort.getAttribute('aria-pressed')!=='true')sortCards(sort.dataset.sort);
  const view=event.target.closest('button[data-view]');
  if(view&&view.getAttribute('aria-pressed')!=='true')setView(view.dataset.view);
  const button=event.target.closest('button[data-filter]');
  if(button){
    selected=button.dataset.filter===selected?'':button.dataset.filter;
    selectedGroupId=selected?(button.dataset.groupId||''):'';
    if(selectedGroupId&&selectedFolderGroupIds&&!selectedFolderGroupIds.has(selectedGroupId)){
      selectedFolderId='';selectedFolderName='';selectedFolderGroupIds=null;
    }
    filter();
  }
  if(event.target.closest('.reset')){selected='';selectedGroupId='';selectedFolderId='';selectedFolderName='';selectedFolderGroupIds=null;search.value='';filter();}
  const step=event.target.closest('button[data-step]');
  if(step)move(step.closest('.gallery'),Number(step.dataset.step));
});
for(const gallery of document.querySelectorAll('.gallery')){
  // Video cards have one player; downloaded covers are not carousel pages.
  if(gallery.querySelectorAll('.slide').length<2)continue;
  let start=null;
  gallery.addEventListener('touchstart',event=>{
    start=event.target.closest('video,.group-handle')?null:event.changedTouches[0].clientX;
  },{passive:true});
  gallery.addEventListener('touchend',event=>{
    if(start===null)return;
    const distance=event.changedTouches[0].clientX-start;
    if(Math.abs(distance)>50){move(gallery,distance<0?1:-1);suppressMediaClickUntil=Date.now()+400;}
    start=null;
  },{passive:true});
}
document.addEventListener('play',event=>{
  if(event.target.tagName==='VIDEO')document.querySelectorAll('video').forEach(video=>{
    if(video!==event.target)video.pause();
  });
},true);
// Details, image changes and video metadata can change card height at any time.
const cardObserver=new ResizeObserver(scheduleLayout);
[...cards,...cleanTiles].forEach(card=>cardObserver.observe(card));
let containerWidth=grid.clientWidth;
new ResizeObserver(()=>{
  if(containerWidth!==grid.clientWidth){containerWidth=grid.clientWidth;scheduleLayout();}
}).observe(grid);
window.addEventListener('resize',scheduleLayout);
if(document.fonts)document.fonts.ready.then(scheduleLayout);
cardSizeInput.addEventListener('input',event=>setCardSize(event.currentTarget.value));
try{
  const saved=Number(localStorage.getItem('xhs-liked-card-size'));
  if(saved>=140&&saved<=360)setCardSize(saved,false);
}catch{}
try{setView(localStorage.getItem('xhs-liked-view'),false);}catch{setView('detail',false);}
window.libraryPage={
  selectGroup(name,id){
    selected=name;selectedGroupId=id||'';
    if(selectedGroupId&&selectedFolderGroupIds&&!selectedFolderGroupIds.has(selectedGroupId)){
      selectedFolderId='';selectedFolderName='';selectedFolderGroupIds=null;
    }
    filter();
  },
  selectFolder(id,name,groupIds){
    selectedFolderId=id||'';selectedFolderName=id?name:'';
    selectedFolderGroupIds=id?new Set(groupIds):null;
    selected='';selectedGroupId='';filter();
  },
  refreshFolder(groupIds){
    if(!selectedFolderId)return;
    selectedFolderGroupIds=new Set(groupIds);
    if(selectedGroupId&&!selectedFolderGroupIds.has(selectedGroupId)){selected='';selectedGroupId='';}
    filter();
  },
  get activeFolder(){return selectedFolderId;},
  get folderGroupIds(){return selectedFolderGroupIds?[...selectedFolderGroupIds]:[];},
  refresh:filter,setView,trashView,cards,scheduleLayout
};
