<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f8f7f4">
  <title>拾集 · 连接本机资料库</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/cloud.css">
  <script src="/bridge.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark" aria-hidden="true">▯</span><strong>拾集</strong><small>SHIJI</small></div>
    <div class="content">
      <p class="eyebrow">YOUR SPACE, YOUR DEVICE</p>
      <h1>灵感在这里，<br>资料留在你的电脑。</h1>
      <p class="intro">网页界面由本站提供；点赞、收藏、关注、Chrome 书签、图片和视频由你电脑上的拾集服务保存。连接后，浏览器会直接读取本机资料。</p>
      <div class="panel">
        <div class="step"><span>01</span><div><strong>启动本机拾集</strong><p>首次使用先按安装说明运行本机服务。以后需要浏览资料时，保持本机服务运行。</p></div></div>
        <div class="step"><span>02</span><div><strong>确认连接</strong><p>点击下方按钮，在本机弹出的确认页授权当前站点访问你的资料库。</p></div></div>
        <div class="actions"><button id="connect" type="button">连接本机资料库 <span aria-hidden="true">↗</span></button><a href="https://github.com/a702120733/shiji#%E5%AE%89%E8%A3%85%E4%B8%8E%E4%BD%BF%E7%94%A8" target="_blank" rel="noopener noreferrer">查看安装说明</a></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
      <p class="footnote">本站不代理或存储个人资料。启用自动分类时，本机服务会按你的设置调用模型服务。</p>
    </div>
  </main>
</body>
</html>
